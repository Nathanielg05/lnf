<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lost and Found App</title>
    <style>
        /* Simple clean styling for usability */
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; }
        .hidden { display: none; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; font-size: 16px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input, select { width: 100%; padding: 8px; box-sizing: border-box; }
        .summary-card { background: #f4f4f4; padding: 15px; border-radius: 5px; margin-top: 15px; }
    </style>
</head>
<body>

    <!-- VIEW 1: STEP 1 - Home Screen with 3 Choice Buttons -->
    <div id="home-view">
        <h1>Lost & Found Portal</h1>
        <p>Please choose an option to begin:</p>
        <button onclick="navigateToSubmission('Lost')">I Lost Something</button>
        <button onclick="navigateToSubmission('Found')">I Found Something</button>
        <button onclick="navigateToSubmission('Admin')">Admin</button>
    </div>

    <!-- VIEW 2: STEP 2 - Submission Form (Modular Layout) -->
    <div id="submission-view" class="hidden">
        <!-- Dynamic header requested in Step 1 -->
        <h1 id="submission-header">[User] Submission</h1>
        
        <form id="item-form" onsubmit="submitItemToBackend(event)">
            <!-- Modular Descriptor: Category -->
            <div class="form-group">
                <label for="category">Category (Descriptor):</label>
                <select id="category" required>
                    <option value="">-- Select Category --</option>
                    <option value="Electronics">Electronics</option>
                    <option value="Keys">Keys</option>
                    <option value="Wallet/ID">Wallet / ID</option>
                    <option value="Clothing">Clothing</option>
                </select>
            </div>
           <!--Modified11/02/26 by Aaron:--> 
                <label for="Color">Color (Descriptor):</label>
                <select id="Color" required>
                    <option value="">-- Select Category --</option>
                    <option value="Red">Red</option>
                    <option value="Blue">Blue</option>
                    <option value="Black">Black</option>
                    <option value="White">white</option>
                </select>
            </div>
            

            <!-- Modular Descriptor: Location (Step 2 requirement) -->
            <div class="form-group">
                <label for="locationFound">Location:</label>
                <input type="text" id="locationFound" placeholder="e.g., Library Building A" required>
                <select id="locationFound" required>
                    </option value="">-- Select Category --</option>
                </option value="Old Main">Old Main</option>
                </option value="Wooster">Wooster</option>
                </option value="Science Hall">Science Hall</option>
                </option value="Smiley">Smiley</option>
                </option value="Fine Arts">Fine Arts</option>
                </select>
            </div>

            <div class="form-group">
                <label for="description">Item Description:</label>
                <input type="text" id="description" placeholder="e.g., Black iPhone 15 with sticker" required>
            </div>

            <div class="form-group">
                <label for="foundername">Your Name:</label>
                <input type="text" id="foundername" placeholder="e.g., John Doe" required>
            </div>

            <button type="submit">Submit Item</button>
            <button type="button" onclick="resetToHome()">Back</button>
        </form>
    </div>

    <!-- VIEW 3: STEP 3 - Summary Page -->
    <div id="summary-view" class="hidden">
        <h1>Submission Summary</h1>
        <p>Your item has been successfully saved to the database!</p>
        
        <div class="summary-card" id="summary-content">
            <!-- Populated dynamically via JavaScript -->
        </div>

        <button onclick="resetToHome()">Submit Another Item</button>
    </div>

    <script>
        let currentMode = ""; // Tracks if user chose Lost, Found, or Admin

        // STEP 1: Handle button clicks and update the dynamic header
        function navigateToSubmission(mode) {
            currentMode = mode;
            document.getElementById('home-view').classList.add('hidden');
            document.getElementById('submission-view').classList.remove('hidden');
            
            // Updates header text to match requested format: <"[User] submission">
            document.getElementById('submission-headerinnerText', `${currentMode} Submission`);
            document.getElementById('submission-header').textContent = `${currentMode} Submission`;
        }

        // Return to home screen
        function resetToHome() {
            document.getElementById('item-form').reset();
            document.getElementById('submission-view').classList.add('hidden');
            document.getElementById('summary-view').classList.add('hidden');
            document.getElementById('home-view').classList.remove('hidden');
        }

        // STEP 3: Send data to Java Backend -> Firebase, then display summary
        async function submitItemToBackend(event) {
            event.preventDefault();

            // Gather form data into a JavaScript object matching our Java Item model
            const itemData = {
                status: currentMode,
                category: document.getElementById('category').value,
                description: document.getElementById('description').value,
                locationFound: document.getElementById('locationFound').value,
                foundername: document.getElementById('foundername').value,
                whenfound: new Date().toISOString()
            };

            try {
                // Send POST request to Java backend API
                const response = await fetch('/api/items/submit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(itemData)
                });

                if (!response.ok) throw new Error('Failed to save to database');

                const savedItem = await response.json();

                // Display summary view with database response
                document.getElementById('submission-view').classList.add('hidden');
                document.getElementById('summary-view').classList.remove('hidden');

                document.getElementById('summary-content').innerHTML = `
                    <p><strong>ID:</strong> ${savedItem.id}</p>
                    <p><strong>Type:</strong> ${savedItem.status}</p>
                    <p><strong>Category:</strong> ${savedItem.category}</p>
                    <p><strong>Description:</strong> ${savedItem.description}</p>
                    <p><strong>Location:</strong> ${savedItem.locationFound}</p>
                    <p><strong>Submitted By:</strong> ${savedItem.foundername}</p>
                `;
            } catch (error) {
                alert('Error submitting item: ' + error.message);
            }
        }
    </script>
</body>
</html>
